# Render Blueprint: New → Blueprint → pick this repo. Free plan: 512 MB RAM, sleeps after 15 min idle.
services:
  - type: web
    name: ai-task-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY      # your Groq key (secret, entered in the Render dashboard)
        sync: false
      - key: DEMO_PASSWORD    # password visitors need to start runs / approve / reset
        sync: false
